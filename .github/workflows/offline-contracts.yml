name: Offline contracts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pices-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    name: Guarded offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PICES_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact head without a persisted credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify checkout and install public dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$PICES_EXPECTED_COMMIT"
          python -m pip install --no-cache-dir -r requirements.txt ruff==0.16.10
      - name: Lint repair and CI changes
        run: >-
          ruff check --isolated --select E4,E7,E9,F,I,B
          ci/run_offline_tests.py tests/test_offline_ci.py tests/test_curation_batches.py
          scripts/modern_canary_errors.py scripts/modern_synthetic_canary.py
          scripts/modern_request_body_diagnostics.py scripts/modern_draft_schema.py
          scripts/modern_run02_schema_repair.py tests/test_modern_canary_errors.py tests/test_modern_schema_repair.py
          scripts/dataset_access_interpretation.py tests/test_npafc_report2_reconciliation.py
          docs/readiness/2026-10-03/guarded_npafc_report2_qa.py
          docs/readiness/2026-10-03/integrate_npafc_report2_counts.py
          tests/test_residual_source_access.py tests/test_combined_source7.py
          docs/readiness/2026-10-04/validate_residual_source5.py
          docs/readiness/2026-10-04/validate_combined_source7.py
          scripts/citation_creator_interpretation.py tests/test_resource29_reconciliation.py
          tests/test_residual_creator3.py docs/readiness/2026-10-04/validate_residual_source32.py
          tests/test_residual_resource4.py docs/readiness/2026-10-04/validate_residual_resource4.py
          docs/readiness/2026-10-04/build_alias_content_manifest.py
          scripts/source_title_interpretation.py tests/test_residual_title233.py
          tests/test_sensitive_resource11.py tests/test_creator415_institution3.py
          docs/readiness/2026-10-04/validate_residual_evidence15.py
          scripts/content_class_targets.py tests/test_content_class_targets.py
          tests/test_content_class_guards.py tests/test_content_class_review_gaps.py
          docs/readiness/2026-10-04/measure_alias228_targets.py
          tests/test_derived_creator_extension.py
          docs/readiness/2026-10-04/validate_creator8_current.py
          tests/test_residual_target_corrections.py
          docs/readiness/2026-10-04/validate_residual_target_corrections.py
          scripts/mac_sandbox_canary.py tests/test_mac_sandbox_canary.py
          scripts/publication_plan.py tests/test_publication_plan.py
          scripts/production_mutations.py tests/test_production_mutations.py
          scripts/modern_response_evidence.py tests/test_modern_response_evidence.py
          scripts/modern_unknown_create.py tests/test_modern_unknown_create.py
          tests/test_modern_unknown_create_history.py tests/test_modern_citation_organizations.py
          tests/test_modern_reviewed_creators.py tests/test_modern_schema8_history_boundary.py
          tests/test_modern_program_organizations.py
          tests/test_modern_reviewed_citations31.py
          docs/readiness/2026-10-06/measure_modern_reviewed_citations31_coverage.py
          docs/readiness/2026-10-06/aggregate_modern_reviewed_citations31_coverage.py
          docs/readiness/2026-10-06/measure_modern_program20_coverage.py
          docs/readiness/2026-10-06/aggregate_modern_program20_coverage.py
          docs/readiness/2026-10-06/measure_modern_reviewed_creators194_coverage.py
          docs/readiness/2026-10-06/aggregate_modern_reviewed_creators194_coverage.py
          docs/readiness/2026-10-06/measure_modern_citationorg129_coverage.py
          scripts/modern_publication.py scripts/modern_publication_qa.py
          tests/test_modern_publication.py tests/test_modern_publication_qa.py
          tests/test_modern_community_authority.py
          scripts/modern_singleton.py scripts/modern_singleton_executor.py
          scripts/modern_operator.py tests/test_modern_operator.py
          scripts/modern_batch.py tests/test_modern_batch.py
          tests/modern_singleton_fixtures.py tests/test_modern_singleton.py tests/test_modern_singleton_executor.py
          tests/test_modern_organizational_coverage.py
          tests/test_modern_primary_organizations.py
          tests/test_modern_exxon_coverage.py tests/test_modern_upload_compatibility.py
          tests/test_modern_pices_coverage.py
          tests/test_modern_institution_coverage.py
          docs/readiness/2026-10-06/measure_modern_institution91_coverage.py
          docs/readiness/2026-10-06/measure_modern_exxon_coverage.py
          docs/readiness/2026-10-06/measure_modern_direct_primary_coverage.py
          scripts/upload_service.py scripts/reconcile_draft.py
          scripts/publish_records.py scripts/zenodo_api.py
          docs/readiness/2026-10-04/validate_publication_plan.py
      - name: Run guarded offline contracts
        run: python -B ci/run_offline_tests.py
